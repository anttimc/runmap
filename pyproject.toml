[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "runmap"
version = "0.1.0"
description = "Experiments for visualizing terrain and running-route hilliness"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "rasterio>=1.4,<2",
  "scipy>=1.13,<2",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9,<4"]
web = [
  "contourpy>=1.3,<2",
  "fastapi>=0.115,<1",
  "mapbox-vector-tile>=2.2,<3",
  "pillow>=11,<13",
  "shapely>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
